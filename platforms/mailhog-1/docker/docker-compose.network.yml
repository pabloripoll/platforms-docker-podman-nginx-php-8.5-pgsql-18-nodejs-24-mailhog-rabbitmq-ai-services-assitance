services:

  mailer:
    ports:
      - ${COMPOSE_HOST}::${COMPOSE_PORT:-1025}:1025       # SMTP port — send your app mails here
      - ${COMPOSE_HOST}::${COMPOSE_APP_PORT:-8025}:8025   # Web UI + API
    networks:
      net: {}

networks:
  net:
    driver: bridge
    external: true
    name: ${COMPOSE_LEAD}-${COMPOSE_CNET}
  default:
    external: true
    name: ${COMPOSE_LEAD}-${COMPOSE_CNET}