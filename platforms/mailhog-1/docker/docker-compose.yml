services:

  mailer:
    image: ${COMPOSE_IMGK}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "${COMPOSE_LEAD}-${COMPOSE_NAME}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_CPUS}
          memory: ${COMPOSE_MEMO} # On Docker Swarm, move resource limits into 'deploy.resources.limits'
    environment:
      - MH_SMTP_BIND_ADDR=0.0.0.0:1025
      - MH_API_BIND_ADDR=0.0.0.0:8025
    command: ["mailhog", "-smtp-bind-addr=0.0.0.0:1025", "-api-bind-addr=0.0.0.0:8025"]
    volumes:
      - .${COMPOSE_DATA}:/var/lib/mailhog/   # NOTE: MailHog stores messages in memory by default; this dir is present if you add a custom storage backend
      - .${COMPOSE_LOGS}:/var/log/mailhog